services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ribat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ribat
    volumes:
      - ribat_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ribat']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: ribat:${RIBAT_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VITE_DEMO: ${VITE_DEMO:-false}
    environment:
      DATABASE_URL: postgresql://ribat:${POSTGRES_PASSWORD}@postgres:5432/ribat
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ['sh', '-c', 'cd /repo/apps/api && pnpm exec prisma migrate deploy']
    restart: 'no'

  app:
    image: ribat:${RIBAT_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://ribat:${POSTGRES_PASSWORD}@postgres:5432/ribat
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      APP_URL: ${APP_URL:?set APP_URL}
      NODE_ENV: production
      SERVE_WEB: 'true'
      PORT: '3000'
      JOBS_WORKER: 'off'
      SKIP_DB_MIGRATE: 'true'
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Same image, no HTTP: consumes the BullMQ `sessions` queue (ADR-0006).
  worker:
    image: ribat:${RIBAT_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://ribat:${POSTGRES_PASSWORD}@postgres:5432/ribat
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      JOBS_WORKER: 'only'
      SKIP_DB_MIGRATE: 'true'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      app:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  ribat_pg:
