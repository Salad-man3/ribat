<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a4a2b" />
    <script>
      try {
        var d = document.documentElement;
        d.dataset.theme = localStorage.getItem("ribat.theme") || "emerald";
        d.dataset.pattern = localStorage.getItem("ribat.pattern") || "on";
      } catch (e) {
        d.dataset.theme = "emerald";
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Amiri:wght@400;700&family=Reem+Kufi:wght@600&display=swap"
      rel="stylesheet"
    />
    <title>Ribat</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
