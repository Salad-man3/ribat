packages:
  - "apps/*"
  - "packages/*"

overrides:
  multer: 2.5.0
  body-parser: 2.4.0
  source-map-js: 1.2.2
  "undici@>=8.0.0 <9": 8.12.3
  "undici@>=7.0.0 <8": 7.30.1
  "js-yaml@>=5 <6": 5.5.0
  "fast-uri@>=3 <4": 3.1.9
  "qs@>=6.7.0 <7": 6.17.1
  "minimatch@>=3 <11": 11.0.3
  "glob@>=9": 14.0.3
  serialize-javascript: 7.1.4

audit:
  ignore:
    # deepmerge 4.3.1 is latest; GHSA-gcqx-w48m-w2h4 has no patched release (dev: jest-config, Nest CLI, workbox-build).
    - GHSA-gcqx-w48m-w2h4

allowBuilds:
  "@parcel/watcher": true
  "@prisma/client": true
  "@prisma/engines": true
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  msgpackr-extract: false
  prisma: true
  unrs-resolver: true
  workerd: true
